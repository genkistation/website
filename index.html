---
layout: default
title: Gallery
---

<div class="page">
  <h1 class="page-title">Gallery</h1>
  <p>Voici mes photos depuis Flickr :</p>

  <div id="gallery"></div>
</div>

<style>
  #gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 15px;
  }

  #gallery img {
    width: 100%;
    height: auto;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    transition: transform 0.3s ease;
  }

  #gallery img:hover {
    transform: scale(1.05);
  }

  .page h1, .page p {
    margin-bottom: 20px;
  }
</style>

<script>
  // Remplace par TON Flickr  (NSID)
  const FLICKR_ID = "203497831@N05";

  // URL du flux public JSON
  const url = `https://www.flickr.com/services/feeds/photos_public.gne?id=${FLICKR_ID}&format=json&nojsoncallback=1`;

  // Utilisation du proxy AllOrigins pour contourner le CORS
  fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`)
    .then(res => res.json())
    .then(data => {
      const feed = JSON.parse(data.contents);
      const container = document.getElementById("gallery");

      feed.items.forEach(item => {
        const img = document.createElement("img");
        // On prend la version large de l'image (_b)
        img.src = item.media.m.replace("_m", "_b");
        img.alt = item.title;
        container.appendChild(img);
      });
    })
    .catch(err => {
      console.error(err);
      document.getElementById("gallery").innerText = "Impossible de charger les photos.";
    });
</script>
